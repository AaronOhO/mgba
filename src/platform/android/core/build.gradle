plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.mgba.android.core'
    compileSdk 34
    ndkVersion '22.1.7171670'

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('verifyCoreBoundary') {
    def coreSources = fileTree('src/main/java') { include '**/*.kt' }
    inputs.files(coreSources)
    doLast {
        def forbidden = [
                'io.mgba.android.logic',
                'io.mgba.android.data',
                'io.mgba.android.settings',
                'io.mgba.android.shader',
                'io.mgba.android.ui',
                'io.mgba.android.R',
        ]
        def violations = []
        coreSources.each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) {
                    violations << "${source}:$number: $line"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("The :core module depends on an upper layer:\n" + violations.join('\n'))
        }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('verifyCoreBoundary') }
