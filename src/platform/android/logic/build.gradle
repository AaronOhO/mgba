plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.mgba.android.logic'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    api project(':core')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('verifyPureLogic') {
    def logicSources = fileTree('src/main/java') { include '**/*.kt' }
    inputs.files(logicSources)
    doLast {
        def forbidden = [
                'import android.',
                'import androidx.',
                'io.mgba.android.data',
                'io.mgba.android.settings',
                'io.mgba.android.shader',
                'io.mgba.android.ui',
                'io.mgba.android.R',
        ]
        def violations = []
        logicSources.each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { line.contains(it) }) {
                    violations << "${source}:$number: $line"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("The :logic module contains Android or product-layer dependencies:\n" + violations.join('\n'))
        }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('verifyPureLogic') }
