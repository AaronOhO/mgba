plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def androidVersionCode = (providers.gradleProperty('MGBA_ANDROID_VERSION_CODE').orNull ?:
        System.getenv('MGBA_ANDROID_VERSION_CODE') ?: '1').toInteger()
def androidVersionName = providers.gradleProperty('MGBA_ANDROID_VERSION_NAME').orNull ?:
        System.getenv('MGBA_ANDROID_VERSION_NAME') ?: '0.1.0'
def releaseStorePath = providers.gradleProperty('MGBA_ANDROID_KEYSTORE').orNull ?:
        System.getenv('MGBA_ANDROID_KEYSTORE')
def releaseStorePassword = providers.gradleProperty('MGBA_ANDROID_STORE_PASSWORD').orNull ?:
        System.getenv('MGBA_ANDROID_STORE_PASSWORD')
def releaseKeyAlias = providers.gradleProperty('MGBA_ANDROID_KEY_ALIAS').orNull ?:
        System.getenv('MGBA_ANDROID_KEY_ALIAS')
def releaseKeyPassword = providers.gradleProperty('MGBA_ANDROID_KEY_PASSWORD').orNull ?:
        System.getenv('MGBA_ANDROID_KEY_PASSWORD')
def releaseSigningConfigured = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'io.mgba.android'
    compileSdk 34
    ndkVersion '22.1.7171670'

    defaultConfig {
        applicationId 'io.mgba.android'
        minSdk 23
        targetSdk 34
        versionCode androidVersionCode
        versionName androidVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.assets.srcDir "${rootProject.projectDir}/../../../res/shaders"
        test.resources.srcDir "${rootProject.projectDir}/../../../res"
    }

}

dependencies {
    implementation project(':logic')
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.activity:activity-compose:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.compose.ui:ui:1.2.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.2.1'
    implementation 'androidx.compose.material:material:1.2.1'
    implementation 'androidx.compose.material:material-icons-extended:1.2.1'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.2.1'

    testImplementation 'junit:junit:4.13.2'
}
